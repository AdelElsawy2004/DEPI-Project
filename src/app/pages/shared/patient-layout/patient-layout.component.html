<div class="flex min-h-screen flex-col bg-surface-50 text-surface-900 dark:bg-surface-950 dark:text-surface-0">

    <header
        class="border-b border-surface-200/80 bg-surface-0/95 backdrop-blur dark:border-surface-800/80 dark:bg-surface-950/90">
        <div class="mx-auto flex h-16 w-full max-w-[1280px] items-center justify-between gap-4 px-6 lg:px-8">
            <a routerLink="/patient/home" class="flex items-center gap-3 transition-opacity hover:opacity-90">
                <span
                    class="flex h-9 w-9 items-center justify-center rounded-xl bg-primary-500 text-white shadow-sm shadow-primary-500/30">
                    <i class="pi pi-link text-sm"></i>
                </span>
                <span class="text-lg font-semibold tracking-tight text-surface-900 dark:text-surface-0">
                    Med<span class="text-primary-500">Finder</span>
                </span>
            </a>

            <nav class="hidden items-center gap-2 md:flex">
                <a routerLink="/patient/patient-reservations" routerLinkActive="active-nav" [routerLinkActiveOptions]="{ exact: true }"
                    class="inline-flex h-10 items-center gap-2 rounded-xl px-4 text-sm font-medium transition">
                    <i class="pi pi-search text-sm"></i>
                    <span>Search</span>
                
                </a>

                <a routerLink="/patient/patient-reservations"
                    class="inline-flex h-10 items-center gap-2 rounded-xl px-4 text-sm font-medium text-surface-500 transition hover:bg-surface-100 hover:text-surface-900 dark:text-surface-300 dark:hover:bg-surface-900/70 dark:hover:text-surface-0">
                    <i class="pi pi-calendar text-sm"></i>
                    <span>My Reservations</span>
                </a>
            </nav>

            <div class="relative shrink-0">
                <button type="button"
                    class="flex items-center gap-3 rounded-xl px-2 py-2 transition hover:bg-surface-100 dark:hover:bg-surface-800/70"
                    (click)="toggleProfileMenu($event)" [attr.aria-expanded]="isProfileMenuOpen" aria-haspopup="menu">
                    <span
                        class="flex h-8 w-8 items-center justify-center rounded-full bg-primary-100 text-xs font-semibold text-primary-700">
                        {{ profileAvatar }}
                    </span>
                    <span class="hidden flex-col items-start leading-none sm:flex">
                        <span class="text-sm font-medium text-surface-900 dark:text-surface-0">{{ profileName
                            }}</span>
                        <span class="text-[11px] text-surface-500 dark:text-surface-300">{{ profileRole }}</span>
                    </span>
                    <i class="pi text-[10px] text-surface-400 ml-1 dark:text-surface-300"
                        [ngClass]="isProfileMenuOpen ? 'pi-angle-up' : 'pi-angle-down'"></i>
                </button>

                <div *ngIf="isProfileMenuOpen"
                    class="absolute right-0 top-[calc(100%+0.75rem)] z-50 w-72 overflow-hidden rounded-[1.5rem] border border-surface-200 bg-surface-0 shadow-[0_24px_60px_-30px_rgba(15,23,42,0.35)] dark:border-surface-700 dark:bg-surface-900 dark:shadow-[0_24px_60px_-30px_rgba(2,8,20,0.5)]"
                    role="menu">
                    <div class="border-b border-surface-200 px-6 py-5 dark:border-surface-700">
                        <div class="text-lg font-semibold text-surface-900 dark:text-surface-0">
                            {{ profileName }}
                        </div>
                        <div class="text-sm text-surface-500 dark:text-surface-400">
                            {{ profileEmail }}
                        </div>
                    </div>

                    <div>
                        <button type="button"
                            class="flex w-full items-center gap-3 px-6 py-4 text-left text-sm font-medium text-surface-700 transition hover:bg-surface-100 dark:text-surface-200 dark:hover:bg-surface-800/80"
                            (click)="closeProfileMenu()" role="menuitem">
                            <i class="pi pi-user text-base"></i>
                            <span>Profile</span>
                        </button>

                        <button type="button"
                            class="flex w-full items-center gap-3 border-t border-surface-200 px-6 py-4 text-left text-sm font-medium text-surface-700 transition hover:bg-surface-100 dark:border-surface-700 dark:text-surface-200 dark:hover:bg-surface-800/80"
                            (click)="toggleTheme()" role="menuitem">
                            <i class="pi text-base" [ngClass]="layoutService.isDarkTheme() ? 'pi-sun' : 'pi-moon'"></i>
                            <span>{{ layoutService.isDarkTheme() ? 'Light Mode' : 'Dark Mode' }}</span>
                        </button>

                        <a class="flex items-center gap-3 border-t border-surface-200 px-6 py-4 text-sm font-medium text-red-500 transition hover:bg-red-50 dark:border-surface-700 dark:hover:bg-red-500/10"
                            routerLink="/auth/login" (click)="closeProfileMenu()" role="menuitem">
                            <i class="pi pi-sign-out text-base"></i>
                            <span>Logout</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1">
        <router-outlet></router-outlet>
    </main>

</div>
