<div class="landing-page">
    <header class="landing-page__header">
        <a routerLink="/landing" class="landing-page__brand" aria-label="MedFinder home">
            <span class="landing-page__brand-mark">
                <i class="pi pi-link"></i>
            </span>
            <span class="landing-page__brand-name">MedFinder</span>
        </a>

        <div class="landing-page__header-actions">
            <a routerLink="/auth/login" class="landing-page__sign-in">Sign In</a>
            <p-button
                label="Get Started"
                routerLink="/auth/login"
                styleClass="landing-page__button landing-page__button--header"
            />
        </div>
    </header>

    <main class="landing-page__main">
        <section class="landing-page__hero">
            <p-tag
                icon="pi pi-shield"
                value="Trusted by 50+ pharmacies in Egypt"
                styleClass="landing-page__trust-tag"
            />

            <h1 class="landing-page__title">
                Find medicines
                <span>near you</span>
            </h1>

            <p class="landing-page__subtitle">
                Search for medicines across local pharmacies, check availability
                in real-time, and reserve your medication in seconds.
            </p>

            <div class="landing-page__cta-group">
                <p-button
                    label="Create Patient Account"
                    icon="pi pi-user-plus"
                    iconPos="left"
                    routerLink="/auth/login"
                    styleClass="landing-page__button landing-page__button--primary"
                />
                <p-button
                    label="Register Pharmacy"
                    icon="pi pi-building"
                    iconPos="left"
                    routerLink="/auth/login"
                    styleClass="landing-page__button landing-page__button--secondary"
                />
            </div>

            <div class="landing-page__features">
                <article class="landing-page__feature-card" *ngFor="let feature of features">
                    <div class="landing-page__feature-icon">
                        <i [class]="feature.icon"></i>
                    </div>
                    <h2 class="landing-page__feature-title">{{ feature.title }}</h2>
                    <p class="landing-page__feature-description">{{ feature.description }}</p>
                </article>
            </div>
        </section>
    </main>
</div>
