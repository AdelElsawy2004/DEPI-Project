<div class="grid grid-cols-12 gap-4">
    <div class="col-span-12 lg:col-span-6 xl:col-span-3">
        <div class="dashboard-metric-card dashboard-metric-card--blue">
            <div class="dashboard-metric-card__header">
                <div class="dashboard-metric-card__icon dashboard-metric-card__icon--blue">
                    <i class="pi pi-file-pdf"></i>
                </div>
                <div class="dashboard-metric-card__delta dashboard-metric-card__delta--green">
                    <i class="pi pi-chart-line mr-1"></i> +12%
                </div>
            </div>
            <div class="dashboard-metric-card__body">
                <span class="dashboard-metric-card__label">Total Reservations</span>
                <div class="dashboard-metric-card__value">{{ totalReservationsCount }}</div>
            </div>
        </div>
    </div>

    <div class="col-span-12 lg:col-span-6 xl:col-span-3">
        <div class="dashboard-metric-card dashboard-metric-card--indigo">
            <div class="dashboard-metric-card__header">
                <div class="dashboard-metric-card__icon dashboard-metric-card__icon--indigo">
                    <i class="pi pi-clipboard"></i>
                </div>
                <div class="dashboard-metric-card__delta dashboard-metric-card__delta--red">
                    <i class="pi pi-exclamation-circle mr-1"></i> 18 High
                </div>
            </div>
            <div class="dashboard-metric-card__body">
                <span class="dashboard-metric-card__label">Pending Reservations</span>
                <div class="dashboard-metric-card__value">{{ pendingReservationsCount }}</div>
            </div>
        </div>
    </div>

    <div class="col-span-12 lg:col-span-6 xl:col-span-3">
        <div class="dashboard-metric-card dashboard-metric-card--green">
            <div class="dashboard-metric-card__header">
                <div class="dashboard-metric-card__icon dashboard-metric-card__icon--green">
                    <i class="pi pi-check-circle"></i>
                </div>
                <div class="dashboard-metric-card__delta dashboard-metric-card__delta--green">
                    <i class="pi pi-check mr-1"></i> 98% Rate
                </div>
            </div>
            <div class="dashboard-metric-card__body">
                <span class="dashboard-metric-card__label">Confirmed Reservations</span>
                <div class="dashboard-metric-card__value">{{ confirmedReservationsCount }}</div>
            </div>
        </div>
    </div>

    <div class="col-span-12 lg:col-span-6 xl:col-span-3">
        <div class="dashboard-metric-card dashboard-metric-card--red">
            <div class="dashboard-metric-card__header">
                <div class="dashboard-metric-card__icon dashboard-metric-card__icon--red">
                    <i class="pi pi-exclamation-triangle"></i>
                </div>
                <div class="dashboard-metric-card__delta dashboard-metric-card__delta--red">
                    <i class="pi pi-star-fill mr-1"></i> Critical
                </div>
            </div>
            <div class="dashboard-metric-card__body">
                <span class="dashboard-metric-card__label">Low Stock Medicines</span>
                <div class="dashboard-metric-card__value">{{ lowStockMedicineCount }}</div>
            </div>
        </div>
    </div>
</div>
<app-reservations></app-reservations>
<app-inventory></app-inventory>
