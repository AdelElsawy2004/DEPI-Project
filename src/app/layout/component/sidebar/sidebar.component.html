<div class="layout-sidebar" [class.sidebar-collapsed]="isCollapsed">
    <a class="layout-sidebar-brand flex items-center gap-4 transition-opacity hover:opacity-90" routerLink="/" aria-label="MedFinder dashboard">
        <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-primary-500 text-white shadow-sm shadow-primary-500/30">
            <i class="pi pi-link text-base"></i>
        </span>
        <span class="text-xl font-semibold tracking-tight text-surface-900 dark:text-surface-0 hide-on-collapse">
            Med<span class="text-primary-500">Finder</span>
        </span>
    </a>

    <div class="layout-sidebar-divider"></div>

    <div class="layout-sidebar-menu">
        <app-menu></app-menu>
    </div>

    <div class="layout-sidebar-footer">
        <a class="layout-sidebar-footer-link logout-link" routerLink="/auth/login">
            <i class="pi pi-sign-out"></i>
            <span *ngIf="!isCollapsed" class="font-semibold text-lg">Logout</span>
        </a>
    
        <button type="button" class="layout-sidebar-footer-link collapse-button" (click)="toggleSidebar()">
            <i class="pi" [ngClass]="{'pi-angle-left': !isCollapsed, 'pi-angle-right': isCollapsed}"></i>
            <span *ngIf="!isCollapsed" class="font-medium text-lg">Collapse</span>
        </button>
    </div>
</div>
